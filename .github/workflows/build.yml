name: build-apk

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 2eaf35899475bcba631ddfbacd610bc9164ae823

      - name: Fetch cover image
        run: |
          for f in cover_full.jpg cover.jpg cover.png; do
            if curl -fsSL -o "$f" "https://raw.githubusercontent.com/${{ github.repository }}/main/$f"; then
              echo "拿到封面图: $f"; break
            fi
          done

      - name: Raise attachment limits
        run: |
          F=app/src/main/java/com/simplechat/app/data/AttachmentImport.kt
          sed -i 's/const val TEXT_MAX_CHARS = 100_000/const val TEXT_MAX_CHARS = 500_000/' $F
          sed -i 's/private const val PDF_MAX_PAGES = 12/private const val PDF_MAX_PAGES = 40/' $F
          echo "--- 改后的上限 ---"
          grep -nE "TEXT_MAX_CHARS =|PDF_MAX_PAGES =" $F

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        run: |
          export ANDROID_HOME="$HOME/android-sdk"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          curl -sSLo "$RUNNER_TEMP/cli.zip" https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q "$RUNNER_TEMP/cli.zip" -d "$RUNNER_TEMP/cli"
          mv "$RUNNER_TEMP/cli/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          SDKMAN="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMAN" --licenses > /dev/null || true
          "$SDKMAN" "platform-tools" "platforms;android-37" "build-tools;37.0.0" || "$SDKMAN" "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Make launcher icons
        run: |
          IMG=$(ls cover*.jpg cover*.png 2>/dev/null | head -1)
          if [ -z "$IMG" ]; then echo "::warning::没找到封面图，保留原图标"; exit 0; fi
          echo "使用封面图: $IMG"
          python3 -m pip install --quiet pillow
          COVER="$IMG" python3 - <<'PY'
          from PIL import Image
          import os
          im = Image.open(os.environ["COVER"]).convert("RGB")
          W, H = im.size
          body = im.crop((0, 0, W, H - int(H * 0.12)))
          bw, bh = body.size
          side = min(bw, bh)
          top = max(0, int((bh - side) * 0.32))
          sq = body.crop(((bw - side) // 2, top, ((bw - side) // 2) + side, top + side))
          for name, px in [("mdpi",108),("hdpi",162),("xhdpi",216),("xxhdpi",324),("xxxhdpi",432)]:
              d = "app/src/main/res/mipmap-" + name
              os.makedirs(d, exist_ok=True)
              c = Image.new("RGB", (px, px), (255, 255, 255))
              s = int(px * 0.92)
              c.paste(sq.resize((s, s), Image.LANCZOS), ((px - s)//2, (px - s)//2))
              c.save(d + "/ic_launcher_foreground.png", optimize=True)
          PY
          f=app/src/main/res/drawable/ic_launcher_background.xml
          [ -f "$f" ] && sed -i 's/#FFF3F5F8/#FFFFFFFF/g; s/#F3F5F8/#FFFFFFFF/g' "$f"

      - name: Build release
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: SimpleChat-release
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error
