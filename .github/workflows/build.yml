name: build-apk

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v1.1.2

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        run: |
          export ANDROID_HOME="$HOME/android-sdk"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          curl -sSLo "$RUNNER_TEMP/cli.zip" \
            https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q "$RUNNER_TEMP/cli.zip" -d "$RUNNER_TEMP/cli"
          mv "$RUNNER_TEMP/cli/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          SDKMAN="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMAN" --licenses > /dev/null || true
          "$SDKMAN" "platform-tools" "platforms;android-37" "build-tools;37.0.0" \
            || "$SDKMAN" "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Inject crash catcher
        run: |
          cat > app/src/main/java/com/simplechat/app/App.kt <<'KOTLIN'
          package com.simplechat.app

          import android.app.Application
          import android.content.ContentValues
          import android.content.Context
          import android.os.Build
          import android.provider.MediaStore
          import com.simplechat.app.data.ChatRepository
          import com.simplechat.app.data.LocaleHelper
          import com.simplechat.app.data.Res
          import com.simplechat.app.data.SettingsStore
          import com.simplechat.app.db.AppDatabase
          import com.simplechat.app.net.ChatApi
          import com.simplechat.app.net.SseClient
          import com.simplechat.app.net.anthropic.AnthropicApi
          import kotlinx.coroutines.CoroutineScope
          import kotlinx.coroutines.Dispatchers
          import kotlinx.coroutines.launch
          import kotlinx.serialization.json.Json
          import okhttp3.OkHttpClient
          import java.io.File
          import java.text.SimpleDateFormat
          import java.util.Date
          import java.util.Locale

          class App : Application() {

              lateinit var container: AppContainer
                  private set

              override fun attachBaseContext(newBase: Context) {
                  installCrashCatcher(newBase)
                  super.attachBaseContext(LocaleHelper.wrapAppBase(newBase))
              }

              override fun onCreate() {
                  super.onCreate()
                  Res.init(this)
                  container = AppContainer(this)
                  CoroutineScope(Dispatchers.IO).launch {
                      container.settingsStore.migrateLegacyApiKey()
                  }
              }

              private fun installCrashCatcher(ctx: Context) {
                  val previous = Thread.getDefaultUncaughtExceptionHandler()
                  Thread.setDefaultUncaughtExceptionHandler { t, e ->
                      runCatching {
                          val text = buildString {
                              appendLine("time=" + SimpleDateFormat("yyyy-MM-dd HH:mm:ss", Locale.US).format(Date()))
                              appendLine("device=" + Build.MANUFACTURER + " " + Build.MODEL +
                                  " android=" + Build.VERSION.RELEASE + " api=" + Build.VERSION.SDK_INT)
                              appendLine("thread=" + t.name)
                              appendLine(e.stackTraceToString())
                              e.cause?.let { appendLine("--- cause ---"); appendLine(it.stackTraceToString()) }
                          }
                          ctx.getExternalFilesDir(null)?.let { dir ->
                              dir.mkdirs()
                              File(dir, "crash.txt").writeText(text)
                          }
                          if (Build.VERSION.SDK_INT >= 29) {
                              val cv = ContentValues().apply {
                                  put(MediaStore.Downloads.DISPLAY_NAME, "simplechat-crash.txt")
                                  put(MediaStore.Downloads.MIME_TYPE, "text/plain")
                              }
                              ctx.contentResolver.insert(MediaStore.Downloads.EXTERNAL_CONTENT_URI, cv)?.let { uri ->
                                  ctx.contentResolver.openOutputStream(uri)?.use { it.write(text.toByteArray()) }
                              }
                          }
                      }
                      previous?.uncaughtException(t, e)
                  }
              }
          }

          class AppContainer(private val app: Application) {

              val json: Json by lazy { ChatApi.defaultJson() }

              val httpClient: OkHttpClient by lazy { ChatApi.defaultClient() }

              private val sseClient: SseClient by lazy { SseClient(httpClient, json) }

              private val anthropicApi: AnthropicApi by lazy { AnthropicApi(httpClient, json) }

              val chatApi: ChatApi by lazy { ChatApi(httpClient, sseClient, anthropicApi, json) }

              val settingsStore: SettingsStore by lazy { SettingsStore(app) }

              val database: AppDatabase by lazy { AppDatabase.build(app) }

              val chatRepository: ChatRepository by lazy { ChatRepository(database, app) }

              val openCodeSessionId: String by lazy { java.util.UUID.randomUUID().toString() }
          }
          KOTLIN

      - name: Build debug
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: SimpleChat-debug
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error
